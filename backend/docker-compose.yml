version: "3.9"

services:
  backend:
    build: .
    container_name: rfid-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./keys:/app/keys
    command: >
      sh -c "python -c 'from database.migrations import run_migrations; run_migrations()' && \
             uvicorn main:app --host 0.0.0.0 --port ${SERVER_PORT:-8000}"

networks:
  default:
    name: rfid-marathon-net

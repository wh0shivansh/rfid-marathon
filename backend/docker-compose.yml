version: "3.9"

services:
  rfid-listener:
    build: .
    container_name: rfid-listener-9090
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "9090:9090"
    environment:
      SERVER_HOST: 0.0.0.0
      RFID_LISTENER_PORT: 9090
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./keys:/app/keys
      - ./race_state.json:/app/race_state.json
    command: python rfid_listener.py
    depends_on:
      - backend

  backend:
    build: .
    container_name: rfid-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./keys:/app/keys
      - ./race_state.json:/app/race_state.json

networks:
  default:
    name: rfid-marathon-net
